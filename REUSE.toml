version = 1

# The Gradle wrapper scripts are generated third-party files. Preserve their
# upstream copyright and Apache-2.0 notice instead of relabeling them as MIT.
[[annotations]]
path = [
    "gradlew",
    "gradlew.bat",
]
precedence = "aggregate"
SPDX-License-Identifier = "Apache-2.0"

# Screenshot baselines are generated per test, so they are covered by pattern rather than by a
# sidecar each.
[[annotations]]
path = [
    "**/src/test/snapshots/**/*.png",
]
SPDX-FileCopyrightText = "2026 Stanford University and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"

# Android's resource merger rejects adjacent .license sidecars in res/.
[[annotations]]
path = [
    "sample-app/src/main/res/mipmap-*/*.webp",
    "ui-theme/src/main/res/font/*.ttf",
]
SPDX-FileCopyrightText = "2026 Stanford University and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"

# Module READMEs carry no license header, so they are covered here.
[[annotations]]
path = [
    "fhir-contract/README.md",
    "health-bulk-export/README.md",
    "health-fhir/README.md",
    "license/README.md",
]
SPDX-FileCopyrightText = "2026 Stanford University and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"

# Verbatim copies of grove-fhir's exchange protocol catalog and conformance corpora, which the tests run.
[[annotations]]
path = [
    "fhir-contract/src/test/resources/grove-fhir/exchange-protocol.json",
    "fhir-contract/src/test/resources/grove-fhir/corpora/**",
    "health-fhir/src/test/resources/grove-fhir/corpora/**",
]
SPDX-FileCopyrightText = "2026 Schmiedmayer Lab and the project authors (see https://github.com/SchmiedmayerLab/grove-fhir)"
SPDX-License-Identifier = "MIT"
